workflows:
  nevermissit-release:
    name: NeverMissIt Release
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      java: 17
      groups:
        - NeverMissIt
      vars:
        PACKAGE_NAME: com.studioverse.nevermissit
    scripts:
      - name: Restore, build, sign, and verify NeverMissIt AAB
        script: |
          set -euo pipefail

          KEYSTORE="$CM_BUILD_DIR/nevermissit-release.jks"
          AAB="$CM_BUILD_DIR/app/build/outputs/bundle/release/app-release.aab"
          GRADLE_LOG="$CM_BUILD_DIR/gradle-build.log"

          echo "$NEVERMISSIT_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"

          export CM_KEYSTORE_PATH="$KEYSTORE"
          export CM_KEYSTORE_PASSWORD="$NEVERMISSIT_KEYSTORE_PASSWORD"
          export CM_KEY_ALIAS="$NEVERMISSIT_KEY_ALIAS"
          export CM_KEY_PASSWORD="$NEVERMISSIT_KEY_PASSWORD"

          keytool -list -keystore "$CM_KEYSTORE_PATH" -storepass "$CM_KEYSTORE_PASSWORD" -alias "$CM_KEY_ALIAS" >/dev/null
          echo "Signing keystore restored and verified."

          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
          echo "Java version:" | tee "$GRADLE_LOG"
          java -version 2>&1 | tee -a "$GRADLE_LOG"
          echo "Gradle version:" | tee -a "$GRADLE_LOG"
          ./gradlew --version 2>&1 | tee -a "$GRADLE_LOG"
          echo "Starting release build..." | tee -a "$GRADLE_LOG"

          set +e
          ./gradlew clean bundleRelease --stacktrace --info >> "$GRADLE_LOG" 2>&1
          GRADLE_STATUS=$?
          set -e

          if [ "$GRADLE_STATUS" -ne 0 ]; then
            echo "===== GRADLE BUILD FAILED (exit $GRADLE_STATUS) ====="
            tail -n 250 "$GRADLE_LOG"
            exit "$GRADLE_STATUS"
          fi

          test -s "$AAB"
          echo "Gradle AAB created: $AAB"

          echo "Checking Gradle-generated AAB signature..."
          jarsigner -verify -verbose -certs "$AAB" > "$CM_BUILD_DIR/gradle-signature-check.txt" 2>&1 || true
          cat "$CM_BUILD_DIR/gradle-signature-check.txt"

          if grep -q "jar verified" "$CM_BUILD_DIR/gradle-signature-check.txt" && ! grep -q "jar is unsigned" "$CM_BUILD_DIR/gradle-signature-check.txt"; then
            echo "SUCCESS: Gradle produced a signed NeverMissIt AAB."
          else
            echo "Gradle produced an unsigned AAB. Applying explicit signing fallback..."
            jarsigner -keystore "$CM_KEYSTORE_PATH" -storepass "$CM_KEYSTORE_PASSWORD" -keypass "$CM_KEY_PASSWORD" -signedjar "$AAB.signed" "$AAB" "$CM_KEY_ALIAS"
            mv "$AAB.signed" "$AAB"

            echo "Checking explicitly signed AAB..."
            jarsigner -verify -verbose -certs "$AAB" > "$CM_BUILD_DIR/final-signature-check.txt" 2>&1 || true
            cat "$CM_BUILD_DIR/final-signature-check.txt"
            grep -q "jar verified" "$CM_BUILD_DIR/final-signature-check.txt"
            ! grep -q "jar is unsigned" "$CM_BUILD_DIR/final-signature-check.txt"
            echo "SUCCESS: NeverMissIt AAB was explicitly signed and verified."
          fi
    artifacts:
      - app/build/outputs/bundle/release/app-release.aab
      - gradle-build.log
      - gradle-signature-check.txt
      - final-signature-check.txt

  nevermissit-diagnostic:
    name: NeverMissIt Diagnostic
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      java: 17
      groups:
        - NeverMissIt
      vars:
        PACKAGE_NAME: com.studioverse.nevermissit
    scripts:
      - name: Run diagnostic Gradle build
        script: |
          set -u

          LOG="$CM_BUILD_DIR/nevermissit-diagnostic.log"
          echo "NeverMissIt diagnostic build" | tee "$LOG"
          echo "Java version:" | tee -a "$LOG"
          java -version 2>&1 | tee -a "$LOG"
          echo "Gradle version:" | tee -a "$LOG"
          ./gradlew --version 2>&1 | tee -a "$LOG"
          echo "Android SDK: $ANDROID_SDK_ROOT" | tee -a "$LOG"
          echo "Writing local.properties..." | tee -a "$LOG"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
          echo "Running assembleDebug..." | tee -a "$LOG"

          set +e
          ./gradlew clean assembleDebug --stacktrace --info >> "$LOG" 2>&1
          STATUS=$?
          set -e

          echo "===== DIAGNOSTIC RESULT: exit $STATUS =====" | tee -a "$LOG"
          if [ "$STATUS" -ne 0 ]; then
            echo "===== LAST 250 LOG LINES ====="
            tail -n 250 "$LOG"
          else
            echo "DEBUG BUILD SUCCEEDED"
          fi

          exit 0
    artifacts:
      - nevermissit-diagnostic.log
      - app/build/outputs/apk/**/*.apk
